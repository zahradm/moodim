[tool.poetry]
name = "moodim"
version = "1.0.0"
description = "Mood tracking API with clean architecture"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = {extras = ["all"], version = "^0.112.0"}
alembic = "1.13.2"
sqlalchemy = "2.0.31"
pydantic = "2.8.2"
uvicorn = "0.30.4"
dynaconf = "3.2.6"
asyncpg = "^0.29.0"
psycopg2 = "^2.9.9"
pre-commit = "^3.8.0"
passlib = "^1.7.4"
bcrypt = "^4.2.0"
pyjwt = "^2.9.0"
aioredis = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
behave = "^1.2.6"
httpx = "^0.27.0"
black = "^24.3.0"
ruff = "^0.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "manage:app"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
exclude = ["migrations", ".venv", "venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests", "features"]
